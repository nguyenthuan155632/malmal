# The demo beside malmald, which scans for it over HTTP with a token:
#
#   echo "$(head -c 32 /dev/urandom | base64)" > token
#   docker compose up
#
# then open http://127.0.0.1:3000.
services:
  malmald:
    image: ghcr.io/nguyenthuan155632/malmal:0.4.0
    # The scanning options of config/initializers/malmal.rb, as flags.
    command: ["--http", "0.0.0.0:8080", "--token-file", "/run/secrets/token",
              "--policy", "documents", "--types", "pdf,jpeg,png,gif,webp", "--max-size", "20971520"]
    secrets: [token]

  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      MALMAL_URL: http://malmald:8080
      MALMAL_TOKEN_FILE: /run/secrets/token
    secrets: [token]
    depends_on: [malmald]

secrets:
  token:
    file: ./token
