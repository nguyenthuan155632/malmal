# cargo-deny configuration: `cargo deny check`.

[graph]
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # bincode is unmaintained (not a vulnerability). It is only pulled in by
    # yara-x, behind the optional `yara` feature; default builds do not
    # contain it.
    "RUSTSEC-2025-0141",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
]

# The workspace crates carry no license yet and are marked `publish = false`.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between workspace crates have no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
