[package]
name = "malmal-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
malmal = { path = "../crates/malmal" }

# Not a member of the main workspace: fuzzing needs a nightly toolchain.
[workspace]


[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

