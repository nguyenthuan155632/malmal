[workspace]
resolver = "3"
members = ["crates/malmal", "crates/malmal-cli", "crates/malmal-ffi"]
# Patched copies of other crates, built as they are, not linted as ours.
exclude = ["third_party"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nguyenthuan155632/malmal"
authors = ["nguyenthuan155632 <nguyenthuan155632@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
