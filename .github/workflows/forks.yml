name: Forks

# The crates in third_party/ are copies of upstream crates under other names,
# which RustSec advisories do not name. Every week, and when a copy changes,
# check the upstream crates at the versions copied for advisories, and fail
# when upstream has released a newer version (it may make a copy unneeded, or
# carry a fix the copy lacks). See third_party/README.md.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "third_party/**"
      - "scripts/forks.py"
      - ".github/workflows/forks.yml"

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/forks.py --offline
      - run: cargo generate-lockfile --manifest-path target/forks/Cargo.toml
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: target/forks/Cargo.toml
          command: check advisories

  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/forks.py
