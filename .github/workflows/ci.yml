name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Known-good files must come back clean
        run: cargo run --release -p malmal --example survey -- --expect-clean tests/corpus/clean
      - name: Build static binaries
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - name: Binaries must not link dynamically
        run: |
          for binary in malmal malmald; do
            file target/x86_64-unknown-linux-musl/release/$binary | grep -E 'static(ally|-pie) linked'
          done
      - name: Run on bare Debian
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/w:ro" \
            debian:stable-slim /w/malmal --version

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p malmal-ffi
      - name: Python binding
        run: python3 -m unittest discover -s bindings/python/tests
        env:
          MALMAL_LIBRARY: ${{ github.workspace }}/target/release/libmalmal_ffi.so
          PYTHONPATH: bindings/python

  # The malmal gem on every Ruby it supports, against the library and the
  # daemon built from this checkout.
  ruby:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        os: [ubuntu-latest]
        include:
          - ruby: "3.4"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/ruby/malmal
    env:
      MALMAL_LIBRARY: ${{ github.workspace }}/target/release/${{ matrix.os == 'macos-latest' && 'libmalmal_ffi.dylib' || 'libmalmal_ffi.so' }}
      MALMALD: ${{ github.workspace }}/target/release/malmald
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked -p malmal-ffi -p malmal-cli
        working-directory: .
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: bindings/ruby/malmal
      - run: bundle exec rake test
      - run: bundle exec rubocop
        if: matrix.ruby == '3.4' && matrix.os == 'ubuntu-latest'

  # malmal-rails on every Rails it supports.
  rails:
    strategy:
      fail-fast: false
      matrix:
        rails: ["7_1", "7_2", "8_0", "8_1"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/ruby/malmal-rails
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/bindings/ruby/malmal-rails/gemfiles/rails_${{ matrix.rails }}.gemfile
      MALMAL_LIBRARY: ${{ github.workspace }}/target/release/libmalmal_ffi.so
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked -p malmal-ffi
        working-directory: .
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: bindings/ruby/malmal-rails
      - run: bundle exec rake test
      - run: BUNDLE_GEMFILE=Gemfile bundle install && BUNDLE_GEMFILE=Gemfile bundle exec rubocop
        if: matrix.rails == '8_1'

  # The feature that is off by default: rebuilding PDF files.
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: >
          cargo test -p malmal -p malmal-cli -p malmal-ffi
          --features malmal/cdr-pdf,malmal-cli/cdr-pdf,malmal-ffi/cdr-pdf

  yara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p malmal -p malmal-cli --features malmal/yara,malmal-cli/yara

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz every target briefly
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            mkdir -p corpus/$target
            cargo fuzz run $target corpus/$target seeds/$target -- \
              -max_total_time=60 -max_len=16384 -timeout=10
          done

  # The oldest Rust the crates declare they build with (`rust-version`).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --workspace --all-targets --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
