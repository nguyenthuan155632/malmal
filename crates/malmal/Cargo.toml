[package]
name = "malmal"
description = "Upload scanner for images, SVG, PDF and PostScript files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["malware", "scanner", "upload", "security", "antivirus"]
categories = ["parsing", "command-line-utilities"]

[dependencies]
aes = "0.8"
brotli-decompressor = "6.3"
image = { version = "0.25.10", default-features = false, optional = true, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
md-5 = "0.10"
memchr = "2.8.3"
miniz_oxide = "0.9.1"
moxcms = { version = "0.8.1", optional = true }
png = { version = "0.18.1", optional = true }
quick-xml = { version = "0.42.0", default-features = false }
serde.workspace = true
sha2.workspace = true
zune-core = { version = "0.5.3", optional = true, default-features = false }
zune-jpeg = { version = "0.5.15", optional = true }
yara-x = { version = "1.23.0", default-features = false, optional = true, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "hash-module",
    "math-module",
    "string-module",
] }
jxl-oxide = { version = "0.12", default-features = false, features = ["image"], optional = true }
svg-hush = { version = "0.9", optional = true }

[features]
# YARA rule matching. Off by default: it adds a WebAssembly runtime and
# several megabytes to the binary.
yara = ["dep:yara-x"]
# Rebuilding raster images from their pixels (`malmal::cdr`). Off by
# default: it adds the decoders and encoders of the `image` crate, which
# already depends on the others.
cdr = [
    "dep:image",
    "dep:jxl-oxide",
    "dep:moxcms",
    "dep:png",
    "dep:zune-core",
    "dep:zune-jpeg",
]
svg-hush = ["dep:svg-hush"]

# With `cdr`, also filtering SVG files down to what draws a picture.
cdr-svg = ["cdr", "dep:svg-hush"]

[lints.rust]
# Set by cargo-fuzz.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(docsrs)"] }

[dev-dependencies]
base64 = "0.22"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
