[package]
name = "malmal-cli"
description = "Command-line scanner and daemon for the malmal upload scanner"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "malmal"
path = "src/bin/malmal.rs"

[[bin]]
name = "malmald"
path = "src/bin/malmald.rs"

[dependencies]
malmal = { path = "../malmal" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

[features]
# Adds the --yara option.
yara = ["malmal/yara"]
