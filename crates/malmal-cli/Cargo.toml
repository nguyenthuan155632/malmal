[package]
name = "malmal-cli"
description = "Command-line scanner and daemon for the malmal upload scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["malware", "scanner", "upload", "security", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "malmal"
path = "src/bin/malmal.rs"

[[bin]]
name = "malmald"
path = "src/bin/malmald.rs"

[dependencies]
malmal = { path = "../malmal", version = "0.2.0" }
memmap2 = "0.9"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

# Where `cargo binstall malmal-cli` finds the prebuilt binaries.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/malmal-v{ version }-{ target }.tar.gz"
bin-dir = "malmal-v{ version }-{ target }/bin/{ bin }"
pkg-fmt = "tgz"

[features]
default = ["cdr", "cdr-svg"]
# Adds `malmal sanitize` and the daemon's `POST /sanitize`.
cdr = ["malmal/cdr"]
# Lets them take SVG files too.
cdr-svg = ["cdr", "malmal/cdr-svg"]
# And PDF files, which come back as pictures of their pages. Off by default:
# it changes what a document is, doubles the size of the binaries, and the
# renderer it relies on calls itself experimental.
cdr-pdf = ["cdr", "malmal/cdr-pdf"]
# Adds the --yara option.
yara = ["malmal/yara"]
