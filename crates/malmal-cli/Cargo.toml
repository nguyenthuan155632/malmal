[package]
name = "malmal-cli"
description = "Command-line scanner and daemon for the malmal upload scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["malware", "scanner", "upload", "security", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "malmal"
path = "src/bin/malmal.rs"

[[bin]]
name = "malmald"
path = "src/bin/malmald.rs"

[dependencies]
malmal = { path = "../malmal", version = "0.2.0" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
libc = "0.2"
seccompiler = "0.5"

[features]
# Adds the --yara option.
yara = ["malmal/yara"]
