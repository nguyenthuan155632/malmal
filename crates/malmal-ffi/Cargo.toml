[package]
name = "malmal-ffi"
description = "C ABI for the malmal upload scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["malware", "scanner", "ffi", "security", "c-abi"]
categories = ["parsing", "external-ffi-bindings"]

[lib]
crate-type = ["staticlib", "cdylib"]
# The Rust API is documented and tested in the `malmal` crate.
doc = false
test = true

[dependencies]
malmal = { path = "../malmal", version = "0.2.0", features = ["cdr", "cdr-svg"] }
serde_json.workspace = true

[features]
# Lets malmal_sanitize take PDF files, which come back as pictures of their
# pages. See the `cdr-pdf` feature of `malmal`.
cdr-pdf = ["malmal/cdr-pdf"]
