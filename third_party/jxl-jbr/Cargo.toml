
[package]
edition = "2024"
name = "malmal-jxl-jbr"
version = "0.2.1"
authors = ["Wonwoo Choi <chwo9843@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "JPEG bitstream reconstruction from JPEG XL bitstream: jxl-jbr with the fixes malmal needs, until they are released upstream"
readme = "README.md"
keywords = [
    "jpeg-xl",
    "decoder",
    "jxl-oxide",
]
categories = ["multimedia::images"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nguyenthuan155632/malmal"
resolver = "2"

[lib]
name = "jxl_jbr"
path = "src/lib.rs"

[dependencies.brotli-decompressor]
version = "5.0.0"

[dependencies.jxl-bitstream]
version = "1.0.0"

[dependencies.jxl-frame]
version = "0.13.0"

[dependencies.jxl-grid]
version = "0.6.0"

[dependencies.jxl-image]
version = "0.13.0"

[dependencies.jxl-modular]
version = "0.11.2"

[dependencies.jxl-oxide-common]
version = "1.0.0"

[dependencies.jxl-threadpool]
version = "1.0.0"

[dependencies.jxl-vardct]
version = "0.11.0"

[dependencies.tracing]
version = "0.1.40"
features = ["std"]
default-features = false
