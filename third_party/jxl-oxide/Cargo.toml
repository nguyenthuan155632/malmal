
[package]
edition = "2024"
name = "malmal-jxl-oxide"
version = "0.12.6"
authors = ["Wonwoo Choi <chwo9843@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "JPEG XL decoder written in pure Rust: jxl-oxide with the fixes malmal needs, until they are released upstream"
readme = "README.md"
keywords = [
    "jpeg-xl",
    "decoder",
    "jxl-oxide",
]
categories = ["multimedia::images"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nguyenthuan155632/malmal"
resolver = "2"

[package.metadata.docs.rs]
features = ["image"]

[features]
__examples = ["image?/png"]
default = ["rayon"]
image = [
    "dep:bytemuck",
    "dep:image",
]
lcms2 = [
    "dep:bytemuck",
    "dep:lcms2",
]
moxcms = ["dep:moxcms"]
rayon = ["jxl-threadpool/rayon"]

[lib]
name = "jxl_oxide"
path = "src/lib.rs"


[dependencies.brotli-decompressor]
version = "5.0.0"

[dependencies.bytemuck]
version = "1.19.0"
optional = true

[dependencies.image]
version = "0.25.8"
optional = true
default-features = false

[dependencies.jxl-bitstream]
version = "1.1.0"

[dependencies.jxl-color]
version = "0.11.0"

[dependencies.jxl-frame]
version = "0.13.3"

[dependencies.jxl-grid]
version = "0.6.2"

[dependencies.jxl-image]
version = "0.13.0"

[dependencies.jxl-jbr]
version = "0.2.1"
package = "malmal-jxl-jbr"
path = "../jxl-jbr"

[dependencies.jxl-oxide-common]
version = "1.0.0"

[dependencies.jxl-render]
version = "0.12.4"
package = "malmal-jxl-render"
path = "../jxl-render"

[dependencies.jxl-threadpool]
version = "1.0.0"

[dependencies.lcms2]
version = "6.0.0"
optional = true

[dependencies.moxcms]
version = "0.8.1"
optional = true

[dependencies.tracing]
version = "0.1.40"
features = ["std"]
default-features = false
